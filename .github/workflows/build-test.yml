name: Build Mareas IHM Pro
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - run: cp app/build/outputs/apk/debug/*.apk Mareas-IHM-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mareas-IHM-Pro
          path: Mareas-IHM-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mareas-IHM-Pro-AAB-unsigned
          path: app/build/outputs/bundle/release/*.aab
